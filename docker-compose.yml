services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: shortlinks
      POSTGRES_USER: shortlinks
      POSTGRES_PASSWORD: shortlinks
    volumes:
      - db-data:/var/lib/postgresql/data

  backend:
    build: ./backend
    depends_on:
      - db
    environment:
      DB_URL: jdbc:postgresql://db:5432/shortlinks
      DB_USER: shortlinks
      DB_PASSWORD: shortlinks
      APP_BASE_URL: http://localhost:8080
      CORS_ALLOWED_ORIGIN: http://localhost:3000
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  db-data:
